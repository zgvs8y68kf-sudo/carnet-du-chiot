<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet du Chiot</title>
<meta name="description" content="Programme d'éducation, journée type, soucis à travailler et rappels pour un chiot golden retriever.">
<meta name="theme-color" content="#F2F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet Chiot">
<style>
/* Direction « Clinique chaleureuse » : police du téléphone, fond gris doux, cartes blanches, une seule couleur d'accent (le doré du golden).
   Mise en page : une colonne de 560 px max, barre d'onglets fixe en bas, détails dans un panneau qui monte du bas. */
:root{
  --bg:#F2F3F0; --card:#FFFFFF; --ink:#1B1E1C; --muted:#69706B; --faint:#9AA19C; --line:#E4E6E2; --fill:#ECEEEA;
  --accent:#B5761B; --accent-ink:#8C5A10; --accent-soft:#FBF1DF;
  --ok:#2F7D55; --ok-soft:#E3F1E8; --warn-ink:#6E4A10; --warn-soft:#FBF1DF; --bad:#B23A2E; --bad-soft:#FBE7E4;
  --btn:#1B1E1C; --btn-ink:#FFFFFF; --shadow:0 1px 2px rgba(27,30,28,.06);
  --c-nom:#B5761B; --c-mors:#8A4A78; --c-laisse:#2F7A52; --c-prop:#36689A; --c-bonus:#5C6A60; --c-soc:#1E7B78; --c-maison:#5559A6;
  --fur:#D9A441; --fur-dark:#AE7620; --fur-light:#F0CC7E; --nose:#2A1E14; --human:#8A948E; --scene:#F1F2EE; --box:#C69B62;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r:16px; --r-s:10px;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121413; --card:#1B1E1C; --ink:#E8EAE7; --muted:#A0A7A2; --faint:#737A75; --line:#2A2E2B; --fill:#242825;
  --accent:#D9A04A; --accent-ink:#E6B467; --accent-soft:#2E2617;
  --ok:#5FB386; --ok-soft:#1C2E24; --warn-ink:#F0D7A6; --warn-soft:#2B2414; --bad:#E57B6E; --bad-soft:#331C19;
  --btn:#E8EAE7; --btn-ink:#121413; --shadow:none;
  --c-nom:#E4A93F; --c-mors:#C98BB8; --c-laisse:#5DBA87; --c-prop:#7FAEDD; --c-bonus:#A0ADA3; --c-soc:#5CC2BE; --c-maison:#A2A6EC;
  --fur:#D9A441; --fur-dark:#A87224; --fur-light:#EBC676; --nose:#1C130C; --human:#8E9D92; --scene:#202421; --box:#9C7646;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121413; --card:#1B1E1C; --ink:#E8EAE7; --muted:#A0A7A2; --faint:#737A75; --line:#2A2E2B; --fill:#242825;
  --accent:#D9A04A; --accent-ink:#E6B467; --accent-soft:#2E2617;
  --ok:#5FB386; --ok-soft:#1C2E24; --warn-ink:#F0D7A6; --warn-soft:#2B2414; --bad:#E57B6E; --bad-soft:#331C19;
  --btn:#E8EAE7; --btn-ink:#121413; --shadow:none;
  --c-nom:#E4A93F; --c-mors:#C98BB8; --c-laisse:#5DBA87; --c-prop:#7FAEDD; --c-bonus:#A0ADA3; --c-soc:#5CC2BE; --c-maison:#A2A6EC;
  --fur:#D9A441; --fur-dark:#A87224; --fur-light:#EBC676; --nose:#1C130C; --human:#8E9D92; --scene:#202421; --box:#9C7646;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
.view{display:grid;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.tnum{font-variant-numeric:tabular-nums}

/* En-tête de vue */
.vhead{display:grid;gap:2px}
.vhead .eyebrow{display:flex;align-items:center;gap:6px;font-size:.86rem;color:var(--muted);font-weight:500}
.vhead h1{font-size:2rem;font-weight:700;letter-spacing:-.02em}
.vhead .meta{color:var(--muted);font-size:.92rem}
.vhead .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.datenav{display:flex;align-items:center;gap:2px;margin-left:-8px}
.datenav button{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.datenav button:hover{background:var(--fill)}
.datenav .ic{width:18px;height:18px}
.datenav .back{font-size:.84rem;font-weight:600;color:var(--accent-ink);width:auto;padding:0 8px;display:inline-flex;align-items:center;gap:2px}

/* Blocs */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{display:grid;gap:8px}
.sec>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-inline:2px}
.sec>header h2{font-size:1.05rem;font-weight:650}
.sec>header .aside{font-size:.84rem;color:var(--muted);font-weight:500}
.sec>header button.aside{color:var(--accent-ink);font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-height:56px;width:100%}
.list>.row:first-child,.list>:first-child .row{border-top:0}
button.row:hover,.row.tap:hover{background:var(--fill)}
.row .tx{flex:1;min-width:0;display:grid;gap:1px}
.row .tx b{font-weight:600;font-size:.98rem;line-height:1.3}
.row .tx small{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px;line-height:1.3}
.row .chev{width:16px;height:16px;color:var(--faint)}
.row.done .tx b{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.lead-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--fill);color:var(--ink);flex:none}
.lead-ic .ic{width:20px;height:20px}

/* Case à cocher ronde */
.ck{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--faint);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.ck svg{width:14px;height:14px;stroke:var(--card);stroke-width:2.6;fill:none;opacity:0}
.done .ck,.ck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.done .ck svg,.ck[aria-pressed="true"] svg{opacity:1}

/* Carte Maintenant */
.now{padding:16px;display:grid;gap:10px}
.now .lbl{display:flex;justify-content:space-between;font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.now .lbl .live{color:var(--accent-ink)}
.now .what{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.now .t{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.now .ti{font-size:1.15rem;font-weight:650;line-height:1.25}
.now p{color:var(--muted);font-size:.93rem}
.now .acts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-s);padding:11px 14px;font-weight:600;font-size:.95rem;min-height:44px}
.btn.pri{background:var(--btn);color:var(--btn-ink)}
.btn.sec2{border:1px solid var(--line);background:var(--card)}
.btn.acc{background:var(--accent);color:#fff}
.btn.full{width:100%}
.btn .ic{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:default}
.now .acts .btn{flex:1}
.now .next{border-top:1px solid var(--line);padding-top:10px;font-size:.88rem;color:var(--muted);display:flex;gap:8px}
.now .next b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Note, alerte */
.note{font-size:.86rem;color:var(--muted);padding-inline:2px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r);padding:12px 14px;width:100%;text-align:left}
.alert .ic{width:20px;height:20px;margin-top:1px}
.alert b{display:block;font-weight:650}
.alert span{font-size:.9rem}
.alert.ok{background:var(--ok-soft);color:var(--ink)}
.tip{padding:14px 16px;display:grid;gap:4px}
.tip h3{font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tip p{font-size:.95rem}

/* Renfort et suivi */
.renf{padding:14px;display:grid;gap:12px}
.renf .top{display:flex;align-items:center;gap:10px}
.renf .top b{flex:1;font-weight:650}
.renf .top .tag{flex:1;font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink)}
.track{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px}
.track .q{grid-column:1/-1;font-size:.86rem;color:var(--muted);min-width:0}
.track .spark{height:32px;grid-column:1;grid-row:2;align-self:center}
.track .step{grid-column:2;grid-row:2}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--card)}
.step button{width:40px;height:38px;display:grid;place-items:center;color:var(--muted);font-size:1.2rem;font-weight:600}
.step button:hover{background:var(--fill)}
.step output{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:3px;height:28px}
.spark i{width:8px;border-radius:2px;background:var(--accent);opacity:.45;min-height:2px}
.spark i.today{opacity:1}
.renf .ex{border-top:1px solid var(--line);margin:0 -14px -14px;padding:0}
.renf .ex .row{border-top:0}

/* Journée */
.notifbar{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%}
.notifbar .tx{flex:1;display:grid;gap:1px}
.notifbar b{font-weight:600}
.notifbar small{font-size:.84rem;color:var(--muted)}
.pill{font-size:.76rem;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--fill);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--ok-soft);color:var(--ok)}
.tl .row{align-items:flex-start;gap:10px;padding-block:12px}
.tl .t{width:48px;flex:none;font-weight:650;font-variant-numeric:tabular-nums;padding-top:3px;font-size:.95rem}
.tl .cat{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--fill);color:var(--muted)}
.tl .cat .ic{width:17px;height:17px}
.tl .cat.repas{color:var(--accent-ink);background:var(--accent-soft)}
.tl .cat.pipi{color:var(--c-prop);background:color-mix(in srgb,var(--c-prop) 12%,transparent)}
.tl .cat.educ{color:var(--c-laisse);background:color-mix(in srgb,var(--c-laisse) 12%,transparent)}
.tl .cat.sieste,.tl .cat.nuit{color:var(--c-maison);background:color-mix(in srgb,var(--c-maison) 12%,transparent)}
.tl .tx p{font-size:.86rem;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl .row.open .tx p{-webkit-line-clamp:unset}
.tl .row.past{opacity:.5}
.tl .row.cur{background:var(--accent-soft)}
.tl .row.cur .t{color:var(--accent-ink)}
.tl .ck{width:24px;height:24px;margin-top:2px}
.tl .night{font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 14px 4px;border-top:1px solid var(--line);background:var(--fill)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.summary div{background:var(--card);padding:10px 12px;display:grid;gap:1px}
.summary b{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
.summary span{font-size:.78rem;color:var(--muted);line-height:1.25}

/* Soucis */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:.88rem;font-weight:500;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sos button{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;display:grid;gap:4px;min-height:72px;align-content:start}
.sos button b{font-size:.92rem;font-weight:600;line-height:1.25}
.sos button small{font-size:.78rem;color:var(--muted)}
.sos button:hover{background:var(--fill)}
.sos button.urg{grid-column:1/-1}
.sos button.urg b{color:var(--bad)}
.switch{width:46px;height:28px;border-radius:99px;background:var(--fill);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* Graphique de suivi */
.chart{display:grid;gap:6px}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:96px;border-bottom:1px solid var(--line);padding-top:16px}
.bars div{position:relative;background:var(--accent);opacity:.5;border-radius:3px 3px 0 0;min-height:2px}
.bars div.today{opacity:1}
.bars div span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-bottom:2px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:.66rem;color:var(--faint);text-align:center}

/* Guide */
.weeks .row .n{width:28px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;text-align:center}
.weeks .row.cur{background:var(--accent-soft)}
.weeks .row.cur .n{color:var(--accent-ink)}
.lvl{font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.lvl.l2{background:var(--bad-soft);color:var(--bad)}
.lvl.l1{background:var(--fill);color:var(--muted)}
.lvl.now{background:var(--warn-soft);color:var(--warn-ink)}
.nums{display:grid;gap:0}
.nums .row{gap:12px}
.nums .row b{font-variant-numeric:tabular-nums;user-select:all}

/* Panneau (détails, réglages, accueil) */
.scrim{position:fixed;inset:0;background:rgba(10,12,11,.38);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;
  background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet.show{transform:none}
.sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 12px)}
.sheet .grab{display:flex;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));gap:12px}
.sheet .grab::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet .grab .tt{font-size:.84rem;font-weight:600;color:var(--muted)}
.sheet .close{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--muted)}
.sheet .close .ic{width:18px;height:18px}
.sheet .body{overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px;align-content:start;overscroll-behavior:contain}
.sheet h2{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
.sheet .kicker{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted);font-weight:500}
.prose{display:grid;gap:10px}
.prose h3{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.prose ol,.prose ul{margin:0;padding-left:22px;display:grid;gap:8px}
.prose li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.prose .hint{font-size:.92rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.prose .src{font-size:.8rem;color:var(--faint)}
ul.no li::marker{content:"✕  ";color:var(--bad)}
ul.yes li::marker{content:"✓  ";color:var(--ok)}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.box.pro{background:var(--accent-soft);border-color:transparent}
.box.debate{border-style:dashed}
.sticky-act{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);padding-top:16px;margin-top:-8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}

/* Formulaires */
.form{display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label{font-size:.86rem;font-weight:600;color:var(--muted)}
.field input{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px;min-height:46px;width:100%;font-size:1rem}
.field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field .help{font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px}
.meals{display:grid;gap:8px}
.meals:empty{display:none}
.meal input{background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 12px;min-height:44px;font-size:1rem}
.meal .btn{width:46px;padding:0;color:var(--muted)}
.inline input{flex:1;min-width:0}
.steps-dots{display:flex;gap:6px;justify-content:center}
.steps-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.steps-dots i.on{background:var(--ink);width:18px;border-radius:3px}
.welcome{display:grid;gap:14px;padding-top:8px}
.welcome img{width:72px;height:72px;border-radius:18px}
.welcome ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.welcome li{display:flex;gap:12px;align-items:flex-start}
.welcome li .lead-ic{background:var(--accent-soft);color:var(--accent-ink)}

/* Barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:.7rem;font-weight:600;color:var(--faint);min-height:48px}
.tabbar button[aria-selected="true"]{color:var(--accent-ink)}
.tabbar .ic{width:24px;height:24px}
.badge{position:relative}

/* Animations des exercices */
svg.scene{display:block;width:100%;height:auto;border-radius:12px;background:var(--scene);cursor:pointer;overflow:hidden}

svg.scene .ln{fill:none;stroke:var(--nose);stroke-width:1.5;stroke-linecap:round}
svg.scene .toy{fill:var(--c-mors)} svg.scene .ball{fill:var(--c-soc)} svg.scene .tr{fill:var(--accent);stroke:var(--fur-dark);stroke-width:1}
svg.scene .hm{fill:var(--human)} svg.scene .hs{fill:none;stroke:var(--human);stroke-width:5;stroke-linecap:round}
svg.scene .gr{stroke:var(--line);stroke-width:2} svg.scene .gd{stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:.5}

svg.scene .lsh{fill:none;stroke:var(--c-laisse);stroke-width:2.5;stroke-linecap:round} svg.scene .hn{stroke:var(--c-laisse);stroke-width:3.5;stroke-linecap:round;fill:none}
svg.scene .rope{stroke:var(--c-mors);stroke-width:3;stroke-linecap:round}
svg.scene .grass{fill:var(--ok)} svg.scene .gblade{stroke:var(--ok);stroke-width:2;stroke-linecap:round}
svg.scene .obj{fill:var(--muted)} svg.scene .door{fill:var(--line)} svg.scene .frame{fill:none;stroke:var(--muted);stroke-width:2}
svg.scene .z{fill:var(--muted);font:700 13px var(--font)} svg.scene .wave{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
svg.scene .boxf{fill:var(--box)} svg.scene .paper{fill:var(--card);stroke:var(--muted);stroke-width:.8} svg.scene .heart{fill:var(--c-mors)}
svg.scene .mat{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}

<script>
(function(){
"use strict";
const C=window.CHIOT;
const {THEMES,EX,PLAN,SLOTS,WEEKS,SOC,GAMES,TIPS,SHEETS,SOURCES,CATS,DAY,ISSUES,MAX_ISSUES,issueById,issueEx,risksFor,depOf}=C;
const {parse,iso,midnight,addDays,daysBetween,fmtMin,fmtDur}=C;

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
// Espaces insécables du français (« … », : ; ! ?)
function fr(s){return String(s).replace(/« /g,"« ").replace(/ ([»:;!?])/g," $1")}
function esc(s){return fr(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function nm(s){return esc(String(s).replace(/\{N\}/g,pup.name||"ton chiot"))}
const ic=(id,cls="ic")=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const CK=`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CAT_IC={repas:"bowl",pipi:"pipi",educ:"ball",sieste:"bed",nuit:"moon"};
const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const fmtLong=new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dayLabel=d=>cap(fmtLong.format(d));

/* ---------- état (stocké sur ce téléphone) ---------- */
const DEFAULT={name:"Buck",birth:"2026-08-06",arrival:"2026-10-15",wake:"07:00",bed:"22:30",meals:["10:30","15:30"],cp:"84200",city:"Carpentras",vet:"",issues:[],example:true};
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let pup=Object.assign({},DEFAULT,load("pup",{}));
if(!Array.isArray(pup.issues)) pup.issues=[];
let checks=load("checks",{});   // { "AAAA-MM-JJ": { id: true } } ; les étapes de la journée sont préfixées "ev:"
let tlog=load("log",{});        // { "AAAA-MM-JJ": { idSouci: nombre } }
let prefs=Object.assign({repas:true,pipi:true,educ:true,sieste:true,nuit:true},load("notifPrefs",{}));
let offset=0, tab="today", guidePage=null;

function savePup(){save("pup",pup);syncPush(false).catch(()=>{})}
function viewDate(){return addDays(new Date(),offset)}
function info(d){return C.dayInfo(d,pup)}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes()}
function isDone(date,id){const c=checks[iso(date)];return !!(c&&c[id])}
function toggle(date,id,force){const k=iso(date);checks[k]=checks[k]||{};checks[k][id]=force!=null?force:!checks[k][id];save("checks",checks)}
function logGet(date,id){const l=tlog[iso(date)];return (l&&l[id])||0}
function logSet(date,id,v){const k=iso(date);tlog[k]=tlog[k]||{};tlog[k][id]=Math.max(0,v);save("log",tlog)}
function activeIssues(){return pup.issues.map(issueById).filter(Boolean)}

/* ---------- animations ---------- */
const D=5;
const R=x=>+(+x).toFixed(3);
function K(a){return a.map(R).join(";")}
function TR(vals,keys,ex=""){return `<animateTransform attributeName="transform" type="translate" values="${vals.join(";")}" keyTimes="${K(keys)}" dur="${D}s" repeatCount="indefinite" ${ex}/>`}
function FLIP(vals,keys){return `<animateTransform attributeName="transform" type="scale" values="${vals.join(";")}" keyTimes="${K(keys)}" dur="${D}s" repeatCount="indefinite" calcMode="discrete"/>`}
function AV(attr,vals,keys){return `<animate attributeName="${attr}" values="${vals.join(";")}" keyTimes="${K(keys)}" dur="${D}s" repeatCount="indefinite"/>`}
function VIS(s,e){return AV("opacity",[0,0,1,1,0,0],[0,s,s+.01,e,e+.01,1])}
function HIDE(s,e){return AV("opacity",[1,1,0,0,1,1],[0,s,s+.01,e,e+.01,1])}
const FADE=AV("opacity",[0,1,1,0],[0,.05,.93,1]);
function nameTxt(){const n=(pup.name||"Toi").trim();return esc(n.length>12?n.slice(0,11)+"…":n)}
function bubble(x,y,t,s,e){const w=t.replace(/&[a-z]+;/g,"x").length*6.4+16;return `<g class="bb" opacity="0">${VIS(s,e)}<rect x="${R(x-w/2)}" y="${y-11}" width="${R(w)}" height="20" rx="10"/><text x="${x}" y="${y+3}" text-anchor="middle">${t}</text></g>`}
function treat(vals,keys,s,e){return `<circle class="tr" r="3.5" opacity="0">${VIS(s,e)}${TR(vals,keys)}</circle>`}
function ground(){return `<line class="gr" x1="0" y1="95" x2="240" y2="95"/>`}
function wrap(inner,label){return `<svg class="scene" viewBox="0 0 240 110" role="img" aria-label="Animation : ${esc(label)} (touche pour mettre en pause)">${inner}</svg>`}
function person(x,hx,hy,o={}){
  const c=o.crouch, hy0=c?52:34, by=c?62:45, bh=c?20:30;
  const arm=o.armX?`<line class="hs" x1="${x+5}" y1="${by+5}" x2="${hx}" y2="${hy}">${AV("x2",o.armX,o.keys)}${AV("y2",o.armY,o.keys)}</line><circle class="hm" r="4.5" cx="${hx}" cy="${hy}">${AV("cx",o.armX,o.keys)}${AV("cy",o.armY,o.keys)}</circle>`
    :`<line class="hs" x1="${x+5}" y1="${by+5}" x2="${hx}" y2="${hy}"/><circle class="hm" cx="${hx}" cy="${hy}" r="4.5"/>`;
  const legs=c?`<path class="hs" d="M${x-4},${by+bh-2} l10,8 l-6,9"/><path class="hs" d="M${x+3},${by+bh-2} l10,4 l0,13"/>`
    :`<line class="hs" x1="${x-4}" y1="74" x2="${x-5}" y2="94"/><line class="hs" x1="${x+4}" y1="74" x2="${x+5}" y2="94"/>`;
  return `<g>${legs}<rect class="hm" x="${x-9}" y="${by}" width="18" height="${bh}" rx="8"/><circle class="hm" cx="${x}" cy="${hy0}" r="9"/>${arm}</g>`;
}
function head(cx,cy,o={}){
  const eye=o.sleep?`<path class="ln" d="M${cx+1},${cy-3} q2.5,2 5,0"/>`:`<circle class="no" cx="${cx+3}" cy="${cy-3.5}" r="1.8"/>`;
  const item=o.toy?`<rect class="toy" x="${cx+12}" y="${cy+5}" width="11" height="8" rx="3"/>`:o.ball?`<circle class="ball" cx="${cx+16}" cy="${cy+9}" r="4.5"/>`:"";
  return `<circle class="fu" cx="${cx}" cy="${cy}" r="11"/><ellipse class="fl" cx="${cx+9}" cy="${cy+3}" rx="7.5" ry="5.5"/><circle class="no" cx="${cx+15}" cy="${cy+1.5}" r="2.4"/>${eye}<ellipse class="fd" cx="${cx-5}" cy="${cy+2}" rx="4.5" ry="8" transform="rotate(15 ${cx-5} ${cy+2})"/>${item}`;
}
function tail(x,y,d,sp=.5){return `<g><path class="tl" d="M${x},${y} ${d}"/><animateTransform attributeName="transform" type="rotate" values="-14 ${x} ${y};14 ${x} ${y};-14 ${x} ${y}" dur="${sp}s" repeatCount="indefinite"/></g>`}
function leg(x,cls,trot,ph){const r=`<rect class="${cls}" x="${x}" y="4" width="6" height="16" rx="3"/>`;
  return trot?`<g>${r}<animateTransform attributeName="transform" type="rotate" values="${ph?"18":"-18"} ${x+3} 4;${ph?"-18":"18"} ${x+3} 4;${ph?"18":"-18"} ${x+3} 4" dur=".4s" repeatCount="indefinite"/></g>`:r}
function dog(pose,o={}){
  if(pose==="sit") return `<g>${tail(-18,14,"q-8,2 -14,-1",o.wag||.5)}<rect class="fd" x="0" y="2" width="6" height="18" rx="3"/><ellipse class="fu" cx="-8" cy="8" rx="13" ry="12"/><ellipse class="fu" cx="3" cy="-3" rx="10" ry="15" transform="rotate(-20 3 -3)"/><rect class="fu" x="6" y="2" width="6" height="18" rx="3"/><ellipse class="fd" cx="-3" cy="18" rx="8" ry="3"/>${head(10,-22,o)}</g>`;
  if(pose==="lie") return `<g>${o.sleep?"":tail(-24,12,"q-8,4 -14,6",.9)}${o.sleep?`<path class="tl" d="M-24,12 q-8,4 -14,6"/>`:""}<ellipse class="fu" cx="-2" cy="11" rx="24" ry="9"/><rect class="fu" x="10" y="15" width="20" height="5" rx="2.5"/>${head(20,2,o)}</g>`;
  const hx=pose==="sniff"?26:20, hy=pose==="sniff"?0:-14;
  return `<g>${tail(-20,-5,"q-9,-5 -12,-15",o.wag||.5)}${leg(-17,"fd",o.trot,1)}${leg(9,"fd",o.trot,0)}<ellipse class="fu" cx="0" cy="0" rx="22" ry="12"/>${o.harness?`<path class="hn" d="M-1,-12 L1,12"/>`:""}${leg(-12,"fu",o.trot,0)}${leg(14,"fu",o.trot,1)}${head(hx,hy,o)}</g>`;
}
function at(x,y,inner,flip){return `<g transform="translate(${x},${y})">${flip?`<g transform="scale(-1,1)">${inner}</g>`:inner}</g>`}
function mover(vals,keys,inner,ex=""){return `<g>${TR(vals,keys)}${ex}${inner}</g>`}

const SCENES={
 name(){const N=nameTxt();return ground()+person(40,58,62)+bubble(62,18,N+" !",.2,.42)
   +`<g transform="translate(150,75)"><g>${FLIP(["1 1","-1 1","1 1"],[0,.38,.95])}${dog("stand")}</g></g>`
   +treat(["58 62","58 62","121 64","121 64"],[0,.55,.68,1],.55,.78)+bubble(100,30,"Oui !",.6,.86)},
 ping(){const N=nameTxt();return ground()+person(30,46,60)
   +treat(["46 60","120 18","196 92","196 92"],[0,.08,.16,1],.01,.3)
   +mover(["80 75","80 75","170 75","170 75","80 75","80 75"],[0,.05,.28,.45,.72,1],`<g>${FLIP(["1 1","-1 1","1 1"],[0,.45,.98])}${dog("stand",{trot:1})}</g>`)
   +bubble(55,16,N,.33,.46)+treat(["50 62","50 62"],[0,1],.72,.9)+bubble(110,22,"Oui !",.74,.92)},
 come(door){const N=nameTxt();return ground()+person(40,60,66,{crouch:1})
   +(door?`<rect class="door" x="52" y="30" width="18" height="65" rx="2"/><rect class="frame" x="52" y="30" width="18" height="65" rx="2"/>`:"")
   +bubble(door?96:72,18,N+(door?" ?":", viens !"),.03,.22)
   +mover(["210 75","210 75","90 75","90 75"],[0,.2,.5,1],at(0,0,dog("stand",{trot:1}),1),FADE)
   +treat(["62 66","62 66"],[0,1],.52,.82)+bubble(130,26,"Bravo !",.55,.86)},
 tug(){return ground()+person(40,74,66)
   +`<line class="rope" x1="74" y1="66" y2="70" x2="86">${AV("x2",[86,92,86,92,86,86],[0,.12,.25,.37,.5,1])}${HIDE(.62,.97)}</line>`
   +`<g>${HIDE(.62,.97)}${mover(["120 75","126 75","120 75","126 75","120 75","120 75"],[0,.12,.25,.37,.5,1],at(0,0,dog("stand",{toy:1,wag:.3}),1))}</g>`
   +`<g opacity="0">${VIS(.62,.97)}${at(120,75,dog("sit"),1)}<rect class="toy" x="66" y="70" width="11" height="8" rx="3"/></g>`
   +bubble(60,18,"Donne",.5,.64)+treat(["74 66","74 66","104 57","104 57"],[0,.66,.74,1],.66,.8)+bubble(150,22,"Oui !",.7,.93)},
 pause(){return ground()+person(40,84,64)
   +mover(["125 75","113 75","113 75","138 75","138 75","118 75","118 75","125 75"],[0,.1,.22,.32,.6,.72,.92,1],at(0,0,dog("stand"),1))
   +bubble(60,18,"Aïe !",.18,.36)+bubble(170,26,"Pause…",.35,.6)
   +`<rect class="toy" x="82" y="76" width="11" height="8" rx="3" opacity="0">${VIS(.62,.95)}</rect>`+bubble(70,18,"Le jouet !",.66,.93)},
 carry(){return ground()+person(212,194,64)
   +mover(["20 75","150 75","150 75"],[0,.45,1],dog("stand",{toy:1,trot:1,wag:.25}),FADE)
   +bubble(170,18,"Bravo !",.5,.88)
   +`<path class="heart" opacity="0" d="M0,3 C-6,-3 -2,-8 0,-4 C2,-8 6,-3 0,3Z">${VIS(.5,.9)}${TR(["185 50","185 32"],[0,1])}</path>`},
 sleep(){const bars=Array.from({length:11},(_,k)=>`<line class="gd" x1="${60+k*12}" y1="58" x2="${60+k*12}" y2="95"/>`).join("");
   const z=(b)=>`<text class="z" x="0" y="0" opacity="0">z<animate attributeName="opacity" values="0;1;0" dur="3s" begin="${b}s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="145 60;160 28" dur="3s" begin="${b}s" repeatCount="indefinite"/></text>`;
   return ground()+bars+`<line class="gd" x1="60" y1="58" x2="180" y2="58"/>`
   +`<g transform="translate(118,75)"><g>${AV("opacity",[1,1],[0,1])}<animateTransform attributeName="transform" type="scale" values="1 1;1 1.04;1 1" dur="2.5s" repeatCount="indefinite"/>${dog("lie",{sleep:1})}</g></g>`+z(0)+z(1)+z(2)},
 mat(){return ground()+person(40,64,60)+`<rect class="mat" x="95" y="90" width="80" height="7" rx="3"/>`
   +at(130,75,dog("lie"))+treat(["64 60","64 60","150 88","150 88"],[0,.3,.45,1],.3,.6)+bubble(150,30,"Reste zen…",.5,.9)},
 tree(){const dash=Array.from({length:12},(_,k)=>`<line class="gd" x1="${k*24}" y1="101" x2="${k*24+10}" y2="101"/>`).join("");

/* ---------- contenu du jour ---------- */
function socId(date){return "soc"+(info(date).dIdx%SOC.length)}
function dayItems(date){
  const i=info(date), ids=C.itemsFor(date,pup);
  const items=ids.map(id=>({id,kind:"ex",ex:EX[id],theme:EX[id].t}));
  items.push({id:socId(date),kind:"soc",theme:"soc",ex:{ti:"Découverte : "+SOC[i.dIdx%SOC.length],d:"5 min · à distance",s:["Montre-lui la nouveauté de loin, friandises pendant qu'il observe.","Laisse-le s'approcher s'il le souhaite, sans le forcer.","S'il recule ou se fige : éloigne-toi et récompense le calme.","Arrête sur une note positive."],h:"Mieux vaut une petite découverte réussie qu'une grosse expérience qui fait peur.",src:"AVSAB, Zoopsy"},anim:"watch"});
  const g=GAMES[i.dIdx%GAMES.length];
  items.push({id:"game",kind:"game",theme:"bonus",ex:{ti:"Jeu : "+g.ti,d:g.m,s:[g.p]},anim:g.a});
  return items;
}
function themeOf(t){return THEMES[t]||{l:"",c:"var(--muted)"}}

/* ---------- étape en cours ---------- */
function currentStep(){
  const plan=C.dayPlan(midnight(new Date()),pup), m=nowMin(), d=midnight(new Date());
  const evs=plan.events.filter(e=>!e.quiet&&!isDone(d,"ev:"+e.id));
  let cur=null;
  for(const e of evs){if(e.m<=m&&m-e.m<=25) cur=e}
  const nxt=evs.find(e=>e.m>m&&(!cur||e.m>cur.m));
  return {cur:cur||nxt,isNow:!!cur,after:cur?nxt:evs.find(e=>nxt&&e.m>nxt.m),plan};
}
function rel(m){const d=m-nowMin();if(Math.abs(d)<=1)return "maintenant";if(d>0)return d<60?"dans "+d+" min":"dans "+fmtDur(d);return "il y a "+(-d)+" min"}

/* ================= AUJOURD'HUI ================= */
function renderToday(){
  const date=viewDate(), i=info(date), wk=WEEKS[i.week-1], items=dayItems(date);
  const done=items.filter(x=>isDone(date,x.id)).length;
  const arr=parse(pup.arrival), before=arr&&daysBetween(arr,date)<0;
  let h=`<header class="vhead">
    <div class="hrow"><div>
      ${dateNav(date)}
      <h1>${esc(pup.name||"Mon chiot")}</h1>
      <p class="meta">${i.ageW!=null?i.ageW+" semaines · ":""}${before?"avant l'arrivée":"semaine "+i.week+" sur 12 : "+esc(wk[0])}</p>
    </div><button class="avatar" data-act="settings" aria-label="Réglages de ${esc(pup.name)}">${ic("user")}</button></div>
  </header>`;
  if(pup.example) h+=`<button class="alert" data-act="onboard">${ic("info")}<span><b>Personnalise le carnet de ${esc(pup.name)}</b>Date de naissance, horaires, ville et soucis éventuels : 1 minute.</span></button>`;
  if(offset===0){
    const s=currentStep();
    if(s.cur){
      const e=s.cur;
      h+=`<section class="card now" aria-label="Étape en cours">
        <div class="lbl"><span>${s.isNow?"Maintenant":"Prochaine étape"}</span><span class="live">${rel(e.m)}</span></div>
        <div class="what"><span class="t">${fmtMin(e.m)}</span><span class="ti">${esc(e.ti)}</span></div>
        ${e.tx?`<p>${nm(e.tx)}</p>`:""}
        <div class="acts"><button class="btn pri" data-act="stepdone" data-id="${e.id}">${ic("check")}C'est fait</button><button class="btn sec2" data-tab-go="day">Toute la journée</button></div>
        ${s.after?`<div class="next"><span>Ensuite</span><b>${fmtMin(s.after.m)}</b><span>${esc(s.after.ti)}</span></div>`:""}
      </section>`;
    } else h+=`<div class="alert ok">${ic("moon")}<span><b>Journée terminée</b>Bonne nuit à ${esc(pup.name)}. Tout recommence au lever.</span></div>`;
  }
  h+=`<section class="sec"><header><h2>À faire aujourd'hui</h2><span class="aside tnum">${done} sur ${items.length}</span></header>
    <div class="list">${items.map(x=>itemRow(date,x)).join("")}</div></section>`;
  const iss=activeIssues();
  if(iss.length){
    h+=`<section class="sec"><header><h2>Renforts</h2><button class="aside" data-tab-go="issues">Mes soucis</button></header>${iss.map(s=>renfCard(date,s)).join("")}</section>`;
  } else {
    h+=`<button class="card notifbar" data-tab-go="issues"><span class="lead-ic">${ic("issue")}</span><span class="tx"><b>Un souci en particulier ?</b><small>Pipi dedans, mordillements, nuits… Ajoute un renfort ciblé.</small></span>${ic("chev","ic chev")}</button>`;
  }
  h+=localAlert();
  const tip=TIPS[i.dIdx%TIPS.length];
  h+=`<section class="card tip"><h3>Conseil du jour</h3><p>${nm(tip)}</p></section>`;
  $("#v-today").innerHTML=h;
}
function dateNav(date){
  return `<div class="eyebrow datenav"><button data-nav="-1" aria-label="Jour précédent">${ic("left")}</button><span>${offset===0?"Aujourd'hui, "+esc(fmtLong.format(date)):esc(dayLabel(date))}</span><button data-nav="1" aria-label="Jour suivant">${ic("chev")}</button>${offset!==0?`<button class="back" data-nav="0">Aujourd'hui</button>`:""}</div>`;
}
function itemRow(date,x){
  const d=isDone(date,x.id), th=themeOf(x.theme);
  return `<div class="row${d?" done":""}"><button class="ck" data-check="${x.id}" aria-pressed="${d}" aria-label="${d?"Décocher":"Cocher"} ${esc(x.ex.ti)}">${CK}</button>
   <button class="tx" data-open="${x.kind}:${x.id}"><b>${nm(x.ex.ti)}</b><small><span class="dot" style="background:${th.c}"></span>${esc(th.l)} · ${esc(x.ex.d)}</small></button>
   ${ic("chev","ic chev")}</div>`;
}
function spark(id,n){
  const vals=[];for(let k=n-1;k>=0;k--) vals.push(logGet(addDays(viewDate(),-k),id));
  const max=Math.max(1,...vals);
  return `<span class="spark" aria-hidden="true">${vals.map((v,k)=>`<i class="${k===n-1?"today":""}" style="height:${Math.max(7,v/max*100)}%"></i>`).join("")}</span>`;
}
function renfCard(date,s){
  const exId=issueEx(s.id,info(date).dIdx,C.itemsFor(date,pup)), ex=EX[exId], v=logGet(date,s.id), d=isDone(date,"rf:"+s.id);
  return `<div class="card renf">
    <div class="top"><span class="tag">${esc(s.ti)}</span><button class="aside small" data-issue="${s.id}" style="color:var(--muted);font-weight:600">Le plan</button></div>
    <div class="track"><span class="q"><b style="color:var(--ink);font-weight:600">${esc(s.log.q)}</b> · aujourd'hui</span>${spark(s.id,7)}
      <span class="step"><button data-log="${s.id}" data-d="-1" aria-label="Moins">−</button><output class="tnum">${v}</output><button data-log="${s.id}" data-d="1" aria-label="Plus">+</button></span></div>
    <div class="ex"><div class="row${d?" done":""}"><button class="ck" data-check="rf:${s.id}" aria-pressed="${d}" aria-label="Cocher ${esc(ex.ti)}">${CK}</button>
      <button class="tx" data-open="ex:${exId}"><b>${nm(ex.ti)}</b><small>Exercice de renfort · ${esc(ex.d)}</small></button>${ic("chev","ic chev")}</div></div>
  </div>`;

function localAlert(){
  if(!pup.cp) return `<button class="card notifbar" data-act="settings">${ic("pin")}<span class="tx"><b>Les dangers de saison près de chez toi</b><small>Ajoute ton code postal dans les réglages.</small></span>${ic("chev","ic chev")}</button>`;
  const month=viewDate().getMonth()+1, rs=risksFor(pup.cp,month).filter(r=>r.now).slice(0,3);
  if(!rs.length) return "";

}

/* ================= JOURNÉE ================= */
function renderDay(){
  const date=viewDate(), plan=C.dayPlan(date,pup), r=plan.rhythm, i=plan.info;
  const isToday=offset===0, m=nowMin(), s=isToday?currentStep():null;
  let h=`<header class="vhead">${dateNav(date)}<h1>Journée</h1><p class="meta">Calculée pour ${i.ageW!=null?i.ageW+" semaines":"son âge"}, lever ${fmtMin(plan.wake)}, coucher ${fmtMin(plan.bed)}.</p></header>
   <div class="summary"><div><b>${r.meals}</b><span>repas</span></div><div><b>${fmtDur(r.awake)}</b><span>d'éveil, puis sieste</span></div><div><b>${r.night||"0"}</b><span>sortie${r.night>1?"s":""} de nuit</span></div></div>
   ${plan.customMeals&&r.meals<r.advisedMeals?`<div class="alert">${ic("bowl")}<span><b>${r.meals} repas, à ${plan.info.ageW} semaines</b>Les vétérinaires conseillent plutôt ${r.advisedMeals} petits repas à cet âge, la ration du jour étant partagée. Si tu restes à ${r.meals}, garde la même quantité totale et parles-en au vétérinaire au prochain rendez-vous. Les heures se changent dans les réglages.</span></div>`:""}
   ${notifBar()}`;
  let rows="", nightShown=false;
  plan.events.forEach(e=>{
    if(e.m>=1440&&!nightShown){nightShown=true;rows+=`<div class="night">Cette nuit</div>`}
    const d=isDone(date,"ev:"+e.id), past=isToday&&e.m<m-25&&!d;
    const cur=s&&s.cur&&s.cur.id===e.id;
    rows+=`<div class="row${d?" done":""}${past?" past":""}${cur?" cur":""}" data-ev="${e.id}">
      <span class="t">${fmtMin(e.m)}</span><span class="cat ${e.cat}">${ic(CAT_IC[e.cat])}</span>
      <button class="tx" data-expand><b>${esc(e.ti)}</b>${e.tx?`<p>${nm(e.tx)}</p>`:""}</button>
      ${e.quiet?"":`<button class="ck" data-check="ev:${e.id}" aria-pressed="${d}" aria-label="${d?"Décocher":"Cocher"} ${esc(e.ti)}">${CK}</button>`}
    </div>`;
  });
  h+=`<div class="list tl">${rows}</div>
   <p class="note">Une trame, pas un horaire militaire. S'il se réveille plus tôt d'une sieste, pipi tout de suite et on décale. Les règles et leurs sources sont dans Guide › Fiches › « La journée type ».</p>`;
  $("#v-day").innerHTML=h;
  if(isToday&&!renderDay.scrolled){const c=$("#v-day .row.cur");if(c){renderDay.scrolled=1;requestAnimationFrame(()=>c.scrollIntoView({block:"center"}))}}
}

function weekStats(s){
  const sum=(a,b)=>{let t=0,n=0;for(let k=a;k<b;k++){const d=addDays(midnight(new Date()),-k),l=tlog[iso(d)];if(l&&l[s.id]!=null){t+=l[s.id];n++}}return n?t/n:null};
  const cur=sum(0,7), prev=sum(7,14);
  if(cur==null) return {txt:"Pas encore de suivi : note chaque jour dans Aujourd'hui"};
  const f=v=>v.toLocaleString("fr-FR",{maximumFractionDigits:1});
  if(prev==null||prev===0) return {txt:"Moyenne sur 7 jours : "+f(cur)};
  const ch=Math.round((cur-prev)/prev*100), good=s.log.k==="down"?ch<0:ch>0;
  return {txt:"Moyenne sur 7 jours : "+f(cur)+" ("+(ch>0?"+":"")+ch+" %"+(ch===0?"":good?", ça progresse":", à surveiller")+")"};
}

// Mois regroupés en périodes : [5,6,7,8,9,10] → « De mai à octobre », [9,10,11,12,1,2] → « De septembre à février ».
function monthsTxt(m){
  if(m.length===12) return "Toute l'année";
  const set=new Set(m), runs=[];
  const seen=new Set();
  for(let k=1;k<=12;k++){ if(set.has(k)&&!set.has(k===1?12:k-1)){let e=k;while(set.has(e===12?1:e+1)&&!seen.has(e)){seen.add(e);e=e===12?1:e+1}runs.push([k,e])} }
  return cap(runs.map(([a,b])=>a===b?MONTHS[a-1]:(a%12)+1===b?MONTHS[a-1]+" et "+MONTHS[b-1]:"de "+MONTHS[a-1]+" à "+MONTHS[b-1]).join(", "));
}

/* ================= PANNEAU ================= */
let sheetOnClose=null, lastFocus=null;
function openSheet(title,html,opts={}){
  lastFocus=document.activeElement;
  $("#sheetTitle").textContent=title||"";
  $("#sheetBody").innerHTML=html;
  $("#sheetBody").scrollTop=0;
  const sh=$("#sheet"), sc=$("#scrim");
  sh.classList.toggle("full",!!opts.full);
  sh.hidden=false; sc.hidden=false;
  requestAnimationFrame(()=>{sh.classList.add("show");sc.classList.add("show")});
  $("#sheetClose").hidden=!!opts.noClose;
  sheetOnClose=opts.onClose||null;
  initScenes($("#sheetBody"));
  setTimeout(()=>{const f=$("#sheetBody [autofocus]")||$("#sheetClose");if(f&&!opts.noFocus)f.focus({preventScroll:true})},260);
}
function closeSheet(){
  const sh=$("#sheet"), sc=$("#scrim");
  sh.classList.remove("show"); sc.classList.remove("show");
  setTimeout(()=>{sh.hidden=true;sc.hidden=true;$("#sheetBody").innerHTML=""},250);
  const f=sheetOnClose; sheetOnClose=null; if(f) f();
  if(lastFocus&&lastFocus.focus) lastFocus.focus({preventScroll:true});
}
$("#sheetClose").onclick=closeSheet;
$("#scrim").onclick=()=>{if(!$("#sheetClose").hidden)closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden&&!$("#sheetClose").hidden)closeSheet()});

  else if(kind==="soc"||kind==="game"){const it=dayItems(date).find(x=>x.id===id);ex=it.ex;theme=it.theme;anim=it.anim;checkId=id}
  else if(kind==="gm"){const g=GAMES[+id];ex={ti:g.ti,d:g.m,s:[g.p]};theme="bonus";anim=g.a}

function chartBlock(s){
  const today=midnight(new Date()), vals=[];for(let k=13;k>=0;k--){const d=addDays(today,-k);vals.push({d,v:logGet(d,s.id)})}
  const max=Math.max(1,...vals.map(x=>x.v)), w=weekStats(s);
  const L=["D","L","M","M","J","V","S"];
  return `<div class="box"><div class="chart"><b style="font-size:.95rem">${esc(s.log.q)}, 14 derniers jours</b>
    <div class="bars" role="img" aria-label="${esc(w.txt)}">${vals.map((x,k)=>`<div class="${k===13?"today":""}" style="height:${x.v/max*100}%">${x.v?`<span>${x.v}</span>`:""}</div>`).join("")}</div>
    <div class="days">${vals.map(x=>`<span>${L[x.d.getDay()]}</span>`).join("")}</div>
    <p class="small muted">${esc(w.txt)}. ${s.log.k==="down"?"Le but : que ça baisse.":"Le but : que ça monte."}</p></div></div>`;
}

    <button class="row" data-act="onboard"><span class="lead-ic">${ic("info")}</span><span class="tx"><b>Revoir l'accueil</b></span>${ic("chev","ic chev")}</button>
   </div>
   <p class="note">Tout est enregistré sur ce téléphone. Les rappels envoient au serveur seulement le prénom, les dates, les horaires et les soucis choisis.</p>`);
  bindPlace();
  bindMeals();
  $("#setForm").onsubmit=e=>{e.preventDefault();readPlace();pup.meals=readMeals();
    Object.assign(pup,{name:$("#fName").value.trim()||"Mon chiot",birth:$("#fBirth").value,arrival:$("#fArrival").value||iso(new Date()),wake:$("#fWake").value||DEFAULT.wake,bed:$("#fBed").value||DEFAULT.bed,vet:$("#fVet").value.trim(),example:false});
    savePup();closeSheet();refresh()};
}
function placeFields(){
  return `<div class="field"><label for="fCp">Code postal</label><div class="inline"><input id="fCp" inputmode="numeric" maxlength="5" autocomplete="postal-code" value="${esc(pup.cp||"")}" placeholder="84200"><button type="button" class="btn sec2" id="geoBtn">${ic("pin")}Me localiser</button></div>
    <span class="help" id="cpHelp">${pup.city?esc(pup.city):"Pour adapter les dangers de saison à ta région."}</span></div>`;
}
// Heures des repas : liste éditable, vide = rythme conseillé pour son âge.
function mealFields(meals){
  const list=(meals&&meals.length?meals:[]);
  return `<div class="field"><label>Heures des repas</label><div class="meals" id="mealList">${list.map(mealInput).join("")}</div>
    <button type="button" class="btn sec2" id="addMeal">${ic("plus")}Ajouter un repas</button>
    <span class="help">Sans heure, le planning suit le rythme conseillé pour son âge (${C.rhythm(info(midnight(new Date())).ageW).meals} repas).</span></div>`;
}
function mealInput(v){return `<div class="inline meal"><input type="time" value="${esc(v||"")}" aria-label="Heure du repas"><button type="button" class="btn sec2" data-delmeal aria-label="Supprimer ce repas">${ic("x")}</button></div>`}
function bindMeals(){
  const l=$("#mealList");
  $("#addMeal").onclick=()=>{if(l.children.length<6){l.insertAdjacentHTML("beforeend",mealInput("12:00"));l.lastElementChild.querySelector("input").focus()}};
  l.addEventListener("click",e=>{const b=e.target.closest("[data-delmeal]");if(b)b.closest(".meal").remove()});
}
function readMeals(){return [...document.querySelectorAll("#mealList input")].map(i=>i.value).filter(Boolean).sort()}
let placeCity=null;
function bindPlace(){
  placeCity=pup.city||"";
  const cp=$("#fCp"), help=$("#cpHelp");
  const look=async()=>{const v=cp.value.trim();if(!/^\d{5}$/.test(v)){placeCity="";return}
    help.textContent="Recherche…";
    try{const r=await fetch("https://geo.api.gouv.fr/communes?codePostal="+v+"&fields=nom&format=json");const j=await r.json();
      placeCity=j[0]?j[0].nom:"";help.textContent=placeCity||"Code postal inconnu.";}
    catch(e){placeCity="";help.textContent="Pas de connexion : la ville s'affichera plus tard."}};
  cp.addEventListener("change",look); cp.addEventListener("input",()=>{if(cp.value.length===5)look()});
  $("#geoBtn").onclick=()=>{
    if(!navigator.geolocation){help.textContent="La localisation n'est pas disponible sur cet appareil.";return}
    help.textContent="Localisation…";
    navigator.geolocation.getCurrentPosition(async p=>{
      const q="?lon="+p.coords.longitude+"&lat="+p.coords.latitude;
      let props=null;
      for(const u of ["https://api-adresse.data.gouv.fr/reverse/","https://data.geopf.fr/geocodage/reverse"]){
        try{const r=await fetch(u+q);const j=await r.json();if(j.features&&j.features[0]){props=j.features[0].properties;break}}catch(e){}
      }
      if(props&&props.postcode){cp.value=props.postcode;placeCity=props.city||"";help.textContent=placeCity}
      else help.textContent="Position hors de France ou introuvable. Saisis le code postal.";
    },()=>{help.textContent="Localisation refusée. Saisis le code postal."},{timeout:10000,maximumAge:600000});
  };
}
function readPlace(){const v=$("#fCp").value.trim();pup.cp=/^\d{5}$/.test(v)?v:"";pup.city=pup.cp?(placeCity||""):""}

/* ---------- accueil (premier lancement) ---------- */
let ob=null;
function onboard(){
  ob={step:0,data:Object.assign({},pup,{issues:[...pup.issues]})};
  obRender();
}
function obRender(){
  const s=ob.step, d=ob.data, N=5;
  const dots=`<div class="steps-dots" aria-hidden="true">${Array.from({length:N},(_,k)=>`<i class="${k===s?"on":""}"></i>`).join("")}</div>`;
  let body="";
  if(s===0) body=`<div class="welcome"><img src="icon-192.png" alt=""><h2>Le carnet de ton chiot</h2>
     <ul><li><span class="lead-ic">${ic("day")}</span><span><b>Sa journée, heure par heure.</b><br><span class="muted">Repas, pipis, siestes et séances, calculés pour son âge.</span></span></li>
     <li><span class="lead-ic">${ic("today")}</span><span><b>Un programme de 12 semaines.</b><br><span class="muted">Quelques minutes par jour, toute la famille.</span></span></li>
     <li><span class="lead-ic">${ic("issue")}</span><span><b>De l'aide pour ses soucis.</b><br><span class="muted">Propreté, morsures, nuits : un plan d'éducateur et un suivi.</span></span></li>
     <li><span class="lead-ic">${ic("bell")}</span><span><b>Des rappels sur ton téléphone.</b><br><span class="muted">Pour ne plus oublier le pipi d'après repas.</span></span></li></ul></div>`;
  else if(s===1) body=`<h2>Ton chiot</h2><div class="form">
     <div class="field"><label for="oName">Prénom</label><input id="oName" maxlength="20" autocomplete="off" value="${esc(d.name)}" autofocus></div>
     <div class="field"><label for="oBirth">Date de naissance</label><input id="oBirth" type="date" value="${esc(d.birth)}"><span class="help">Elle figure sur son carnet de santé ou son certificat de cession.</span></div>
     <div class="field"><label for="oArr">Arrivée à la maison</label><input id="oArr" type="date" value="${esc(d.arrival)}"><span class="help">Le programme de 12 semaines démarre ce jour-là.</span></div></div>`;
  else if(s===2) body=`<h2>Vos horaires</h2><p class="muted">La journée de ${esc(d.name)} est construite entre ces deux heures.</p><div class="form two">
     <div class="field"><label for="oWake">Lever</label><input id="oWake" type="time" value="${esc(d.wake)}"></div>
     <div class="field"><label for="oBed">Coucher</label><input id="oBed" type="time" value="${esc(d.bed)}"></div></div>
     <div class="form">${mealFields(d.meals)}</div>`;
  else if(s===3) body=`<h2>Où vivez-vous ?</h2><p class="muted">Chenilles, épillets, leishmaniose, plage, montagne : les dangers changent selon la région et la saison.</p><div class="form">${placeFields()}</div>`;
  else if(s===4) body=`<h2>Un souci en particulier ?</h2><p class="muted">Choisis jusqu'à ${MAX_ISSUES} soucis. Tu pourras changer à tout moment.</p>
     <div class="chips">${ISSUES.map(x=>`<button class="chip" data-obissue="${x.id}" aria-pressed="${d.issues.includes(x.id)}">${esc(x.ti)}</button>`).join("")}</div>`;
  openSheet("",`${dots}${body}<div class="sticky-act"><div class="inline">${s>0?`<button class="btn sec2" data-ob="back">Retour</button>`:""}<button class="btn pri" style="flex:1" data-ob="next">${s===0?"Commencer":s===N-1?"Terminer":"Continuer"}</button></div>
   ${s===0?`<button class="btn full" data-ob="skip" style="color:var(--muted)">Plus tard</button>`:""}</div>`,{full:true,noFocus:s===0,onClose:()=>{save("onboarded",1)}});
  if(s===3) bindPlace();
  if(s===2) bindMeals();
}
function obCollect(){
  const d=ob.data,s=ob.step;
  if(s===1){d.name=$("#oName").value.trim()||"Mon chiot";d.birth=$("#oBirth").value;d.arrival=$("#oArr").value||iso(new Date())}
  if(s===2){d.wake=$("#oWake").value||DEFAULT.wake;d.bed=$("#oBed").value||DEFAULT.bed;d.meals=readMeals()}
  if(s===3){const v=$("#fCp").value.trim();d.cp=/^\d{5}$/.test(v)?v:"";d.city=d.cp?(placeCity||""):""}
}

/* ---------- rappels (push) ---------- */
const VAPID_PUBLIC="BAWvYH5btN2AlS9X6s2ridfJCpTlLYLJVOSLT8t8csHR_RXRECWhhpZVxueJCCOQJ3oDPfRUK6nENHUNjRTqEt8";
const online=/^https?:$/.test(location.protocol);
const pushOk=online&&"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
let swReg=null, pushSub=null, notifMsg="";
function b64(s){const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function syncBody(extra){return JSON.stringify(Object.assign({subscription:pushSub,pup:{name:pup.name,birth:pup.birth,arrival:pup.arrival,wake:pup.wake,bed:pup.bed,meals:pup.meals||[],issues:pup.issues},prefs,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||"Europe/Paris"},extra||{}))}
async function syncPush(force,extra){
  if(!pushSub) return;
  const body=syncBody(extra), sig=body.length+":"+body.slice(-500);
  const last=load("pushSync",{});
  if(!force&&last.sig===sig&&Date.now()-last.at<7*DAY) return;
  const r=await fetch("/api/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body});
  if(!r.ok) throw new Error("serveur "+r.status);
  save("pushSync",{sig,at:Date.now()});
}
async function enablePush(){
  notifMsg="";
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){notifMsg="Notifications refusées. Autorise-les dans les réglages du téléphone, puis réessaie.";return notifSheet()}
    swReg=swReg||await navigator.serviceWorker.ready;
    pushSub=await swReg.pushManager.getSubscription()||await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID_PUBLIC)});
    await syncPush(true);
    notifMsg="C'est activé. Une notification de test arrive dans quelques secondes.";
  }catch(e){notifMsg="Activation impossible ("+e.message+"). Réessaie dans un instant."}
  notifSheet(); if(tab==="day") renderDay();
}
async function disablePush(){
  try{if(pushSub){await fetch("/api/subscribe",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:pushSub})});await pushSub.unsubscribe()}}catch(e){}
  pushSub=null; save("pushSync",{}); notifMsg="Rappels désactivés sur ce téléphone."; notifSheet(); if(tab==="day") renderDay();
}
function notifState(){
  if(!online) return "offline"; if(isIOS&&!standalone) return "ios"; if(!pushOk) return "nosupport";
  if(Notification.permission==="denied") return "denied"; return pushSub?"on":"off";
}
function notifBar(){
  const st=notifState(), on=st==="on";
  return `<button class="card notifbar" data-act="notifs"><span class="lead-ic">${ic("bell")}</span><span class="tx"><b>Rappels</b><small>${on?"Activés sur ce téléphone":st==="ios"?"Installe d'abord l'app sur l'écran d'accueil":"Reçois une notification à chaque étape"}</small></span><span class="pill${on?" on":""}">${on?"Activés":"Désactivés"}</span>${ic("chev","ic chev")}</button>`;
}
function notifSheet(){
  const st=notifState();
  let h=`<h2>Rappels</h2>`;
  if(st==="offline") h+=`<p>Les rappels fonctionnent une fois l'app en ligne, pas en ouvrant le fichier directement.</p>`;
  else if(st==="ios") h+=`<p>Sur iPhone, les rappels demandent d'installer l'app :</p><div class="prose"><ol><li>Dans Safari, touche le bouton <b>Partager</b> (le carré avec une flèche).</li><li>Choisis <b>Sur l'écran d'accueil</b>, puis <b>Ajouter</b>.</li><li>Ouvre le Carnet depuis la nouvelle icône et reviens ici.</li></ol></div>`;
  else if(st==="nosupport") h+=`<p>Ce navigateur ne gère pas les notifications. Essaie avec Chrome sur Android, ou Safari sur iPhone avec l'app installée sur l'écran d'accueil.</p>`;
  else if(st==="denied") h+=`<p>Les notifications sont bloquées pour cette app. Autorise-les dans les réglages du téléphone, puis rouvre l'app.</p>`;
  else if(st==="off") h+=`<p>Une notification à chaque étape de la journée : repas, pipis, séances, siestes, et la nuit si tu veux. À activer sur chaque téléphone de la famille.</p><button class="btn pri full" data-act="pushon">${ic("bell")}Activer les rappels</button>`;
  else h+=`<p class="muted">Choisis ce que ce téléphone reçoit. Chaque membre de la famille règle le sien.</p>
    <div class="list">${Object.keys(CATS).map(k=>`<div class="row"><span class="lead-ic">${ic(CAT_IC[k])}</span><span class="tx"><b>${esc(CATS[k].l)}</b></span><button class="switch" role="switch" aria-checked="${!!prefs[k]}" data-pref="${k}" aria-label="${esc(CATS[k].l)}"></button></div>`).join("")}</div>
    <div class="inline"><button class="btn sec2" style="flex:1" data-act="pushtest">Envoyer un test</button><button class="btn sec2" style="flex:1" data-act="pushoff">Tout désactiver</button></div>`;
  if(notifMsg) h+=`<p class="small" style="color:var(--ok);font-weight:600">${esc(notifMsg)}</p>`;
  h+=`<p class="note">Les rappels arrivent parfois avec quelques minutes de décalage.</p>`;
  openSheet("Réglages",h);
}
async function initPush(){
  if(!online||!("serviceWorker" in navigator)) return;
  try{
    swReg=await navigator.serviceWorker.register("/sw.js");
    if(pushOk&&Notification.permission==="granted"){pushSub=await swReg.pushManager.getSubscription();if(pushSub) syncPush(false).catch(()=>{})}
  }catch(e){}
  if(tab==="day") renderDay();
}

/* ---------- navigation ---------- */
const VIEWS={today:renderToday,day:renderDay,issues:renderIssues,guide:renderGuide};
function show(t,keepScroll){
  tab=t;
  document.querySelectorAll(".tabbar [data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  Object.keys(VIEWS).forEach(k=>$("#v-"+k).hidden=k!==t);
  if(t==="day") renderDay.scrolled=0;
  VIEWS[t]();
  if(!keepScroll) window.scrollTo(0,0);
  const hash={today:"",day:"#journee",issues:"#soucis",guide:"#guide"}[t];
  try{history.replaceState(null,"",location.pathname+hash)}catch(e){}
}
function rerender(){VIEWS[tab]()}
function refresh(){updateBadge();rerender()}

document.querySelectorAll(".tabbar [data-tab]").forEach(b=>b.onclick=()=>{if(b.dataset.tab==="guide"&&tab==="guide")guidePage=null;show(b.dataset.tab)});

// Toutes les actions passent par un seul écouteur.
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,a");
  if(!t) return;
  const ds=t.dataset;
  if(ds.nav!=null){offset=ds.nav==="0"?0:offset+(+ds.nav);rerender();return}
  if(ds.tabGo){if($("#sheet").hidden===false)closeSheet();show(ds.tabGo);return}
  if(ds.check){const date=viewDate();toggle(date,ds.check);rerender();return}
  if(ds.open){const [k,id]=ds.open.split(":");exSheet(k,id);return}
  if(ds.expand!=null){t.closest(".row").classList.toggle("open");return}
  if(ds.log){const date=viewDate();logSet(date,ds.log,logGet(date,ds.log)+(+ds.d));rerender();return}
  if(ds.issue!=null){issueSheet(ds.issue);return}
  if(ds.issuetoggle){const id=ds.issuetoggle;
    if(pup.issues.includes(id)) pup.issues=pup.issues.filter(x=>x!==id); else if(pup.issues.length<MAX_ISSUES) pup.issues.push(id);
    savePup();closeSheet();refresh();return}
  if(ds.sos!=null){sosSheet(+ds.sos);return}
  if(ds.guide!=null){if(!$("#sheet").hidden)closeSheet();guidePage=ds.guide||null;show("guide");return}
  if(ds.week!=null){const arr=parse(pup.arrival)||midnight(new Date());offset=daysBetween(midnight(new Date()),addDays(arr,+ds.week*7));show("today");return}
  if(ds.sheet!=null){sheetSheet(+ds.sheet);return}
  if(ds.risk){riskSheet(ds.risk);return}
  if(ds.sheetcheck){toggle(viewDate(),ds.sheetcheck);closeSheet();rerender();return}
  if(ds.pref){prefs[ds.pref]=!prefs[ds.pref];save("notifPrefs",prefs);t.setAttribute("aria-checked",prefs[ds.pref]);try{await syncPush(true)}catch(err){notifMsg="Pas de connexion : réessaie plus tard.";notifSheet()}return}
  if(ds.obissue){const d=ob.data,id=ds.obissue;
    if(d.issues.includes(id)) d.issues=d.issues.filter(x=>x!==id); else if(d.issues.length<MAX_ISSUES) d.issues.push(id);
    document.querySelectorAll("[data-obissue]").forEach(b=>b.setAttribute("aria-pressed",d.issues.includes(b.dataset.obissue)));return}
  if(ds.ob){
    if(ds.ob==="skip"){closeSheet();return}
    if(ds.ob==="back"){obCollect();ob.step--;obRender();return}
    obCollect();
    if(ob.step<4){ob.step++;obRender();return}
    pup=Object.assign(pup,ob.data,{example:false});savePup();save("onboarded",1);closeSheet();offset=0;show("today");return}
  switch(ds.act){
    case "settings": settingsSheet(); break;
    case "onboard": onboard(); break;
    case "notifs": notifMsg="";notifSheet(); break;
    case "pushon": t.disabled=true; enablePush(); break;
    case "pushoff": disablePush(); break;
    case "pushtest": try{await syncPush(true,{test:true});notifMsg="Test envoyé."}catch(err){notifMsg="Envoi impossible ("+err.message+")."} notifSheet(); break;
    case "stepdone": toggle(midnight(new Date()),"ev:"+ds.id,true); renderToday(); break;
  }
});

/* ---------- démarrage ---------- */
const h0=location.hash;
show(h0==="#journee"||h0==="#planning"?"day":h0==="#soucis"?"issues":h0==="#guide"?"guide":"today");
initPush();
if(!load("onboarded",0)&&!load("pup",null)) setTimeout(onboard,300);
// L'étape en cours avance toute seule quand l'app reste ouverte.
setInterval(()=>{if(offset===0&&!document.hidden&&(tab==="today"||tab==="day")&&$("#sheet").hidden)rerender()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&offset===0&&$("#sheet").hidden&&(tab==="today"||tab==="day"))rerender()});
})();
</script>
</body>
</html>
